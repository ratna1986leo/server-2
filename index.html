<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <title>Video Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b12;
      --panel: #141824;
      --text: #f4f6fb;
      --muted: #a7afc2;
      --accent: #ff416c;
      --accent-hover: #ff6386;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background: radial-gradient(circle at top, #1b2132 0, var(--bg) 52%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: min(100%, 820px);
      margin: 0 auto;
    }

    .page-header {
      margin: 0 0 18px;
      text-align: center;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 4vw, 2rem);
      letter-spacing: -0.03em;
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .video-card {
      overflow: hidden;
      border: 1px solid #2a3042;
      border-radius: 18px;
      background: #000;
      box-shadow: 0 18px 55px rgb(0 0 0 / 35%);
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 75vh;
      background: #000;
    }

    .status {
      min-height: 1.5em;
      margin: 12px 2px 0;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgb(0 0 0 / 68%);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .popup-overlay[hidden] { display: none; }

    .popup-box {
      width: min(100%, 420px);
      padding: 26px;
      border: 1px solid #343b50;
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgb(0 0 0 / 45%);
      animation: slide-up 220ms ease-out;
    }

    .popup-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      border-radius: 14px;
      background: rgb(255 65 108 / 14%);
      color: var(--accent);
      font-size: 1.5rem;
    }

    .popup-box h2 {
      margin: 0;
      text-align: center;
      font-size: 1.35rem;
    }

    .popup-box p {
      margin: 12px 0 22px;
      color: var(--muted);
      line-height: 1.6;
      text-align: center;
    }

    .popup-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button {
      min-height: 44px;
      padding: 11px 18px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
    }

    button:hover { transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .button-secondary {
      background: #303647;
      color: var(--text);
    }

    .button-primary {
      background: var(--accent);
      color: #fff;
    }

    .button-primary:hover { background: var(--accent-hover); }

    .footer-note {
      margin: 18px 0 0;
      color: #818ba2;
      font-size: 0.8rem;
      text-align: center;
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Video Preview</h1>
      <p>Tonton video di pemutar berikut.</p>
    </header>

    <section class="video-card" aria-label="Pemutar video">
     
<div class="container">
  <video id="video" autoplay muted controls>
    <source src="https://ik.imagekit.io/yhhmgwam7/tutorial%20ganti%20baju%20di%20kamar%20yg%20ada%20CCTVnya%20@mbahmaryonoreborn.mp4?updatedAt=1784049490088" type="video/mp4">
    Browser kamu tidak mendukung video.
  </video>
</div>>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="footer-note">Pastikan kamu memiliki izin untuk membagikan video ini.</p>
  </main>

  <section id="age-dialog" class="popup-overlay" role="dialog"
           aria-modal="true" aria-labelledby="dialog-title"
           aria-describedby="dialog-description" hidden>
    <div class="popup-box">
      <div class="popup-icon" aria-hidden="true">18+</div>
      <h2 id="dialog-title">Konfirmasi Usia</h2>
      <p id="dialog-description">
        Apakah kamu berusia 18 tahun atau lebih dan ingin melanjutkan?
      </p>
      <div class="popup-buttons">
        <button id="cancel-button" class="button-secondary" type="button">BATAL</button>
        <button id="continue-button" class="button-primary" type="button">LANJUT</button>
      </div>
    </div>
  </section>

  <script>
    (() => {
      const video = document.getElementById("video");
      const dialog = document.getElementById("age-dialog");
      const cancelButton = document.getElementById("cancel-button");
      const continueButton = document.getElementById("continue-button");
      const status = document.getElementById("status");

      // Popup muncul sekali setelah video mulai diputar selama 5 detik.
      let popupTimer = null;
      let popupShown = false;

      function showPopup() {
        if (popupShown) return;
        popupShown = true;
        video.pause();
        dialog.hidden = false;
        cancelButton.focus();
      }

      function closePopup() {
        dialog.hidden = true;
      }

      video.addEventListener("play", () => {
        status.textContent = "";
        if (!popupShown && popupTimer === null) {
          popupTimer = window.setTimeout(showPopup, 5000);
        }
      });

      video.addEventListener("pause", () => {
        if (!popupShown && popupTimer !== null) {
          window.clearTimeout(popupTimer);
          popupTimer = null;
        }
      });

      cancelButton.addEventListener("click", () => {
        closePopup();
        status.textContent = "Kamu membatalkan konfirmasi. Tekan putar untuk menonton kembali.";
      });

      continueButton.addEventListener("click", () => {
        closePopup();
        status.textContent = "Konfirmasi selesai. Kamu bisa melanjutkan video.";
        video.play().catch(() => {
          status.textContent = "Tekan tombol putar pada video untuk melanjutkan.";
        });
      });

      dialog.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closePopup();
        }
      });
    })();
  </script>
</body>
</html>
